
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<meta name="robots" content="noindex,nofollow">
<title>Acceso del autor · El futuro aprendió a extrañar</title>
<style>
:root{color-scheme:light;--paper:#f7f3ec;--cream:#fffdf8;--ink:#322d28;--muted:#8e8377;--rust:#9a6145}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.layout{min-height:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 37%,#fffdfa 0%,#f9f6f0 45%,#f4efe7 100%)}
.brand{font:500 10px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;text-transform:uppercase;letter-spacing:.31em;color:#9c826b;margin:0 0 42px}
.symbol{display:grid;place-items:center;width:50px;height:50px;border:1px solid #dbd0c3;border-radius:50%;color:#97694c;margin:0 auto 25px;font:400 26px/1 Georgia,"Iowan Old Style",serif}
.panel{max-width:390px;width:100%;text-align:center}
.eyebrow{text-transform:uppercase;letter-spacing:.24em;color:#987d67;font-size:10px;font-weight:650;margin:0 0 17px}
h1{font:400 clamp(38px,9vw,49px)/1.12 Georgia,"Iowan Old Style",Palatino,serif;letter-spacing:-.05em;margin:0 auto 17px;max-width:330px}
.subtitle{color:#847a71;font-size:14px;line-height:1.65;margin:0 auto 35px;max-width:300px}
.access{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:56px;color:#fff;background:#302b26;border-radius:14px;text-decoration:none;font-weight:550;font-size:15px;box-shadow:0 12px 22px rgba(61,48,38,.11);transition:transform .18s,background .18s}
.access:hover{background:#473c33;transform:translateY(-1px)}
.access:active{transform:scale(.99)}
.access svg{width:20px;height:20px}
.access:focus-visible,.back:focus-visible{outline:2px solid #995c3d;outline-offset:4px}
.explain{font-size:11px;color:#a09385;margin:19px 0 0;line-height:1.65}
.divider{width:38px;height:1px;background:#bca18b;margin:36px auto 27px}
.back{color:#796c5e;text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:7px;padding:10px 6px}
.back svg{width:15px;height:15px}
@media(max-height:650px){.brand{margin-bottom:20px}.symbol{margin-bottom:15px}.subtitle{margin-bottom:23px}.divider{margin:23px auto 14px}}
</style>
</head>
<body>
<main class="layout">
  <section class="panel" aria-labelledby="titulo">
    <p class="brand">Luis Antonio · Autor</p>
    <div class="symbol" aria-hidden="true">✦</div>
    <p class="eyebrow">Acceso de edición</p>
    <h1 id="titulo">Tu libro, en tus manos.</h1>
    <p class="subtitle">Un espacio para seguir escribiendo <em>El futuro aprendió a extrañar.</em></p>
    <a class="access" href="https://app.pagescms.org/" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.85 10.92.57.1.79-.25.79-.55 0-.27-.01-.98-.02-1.92-3.19.69-3.86-1.54-3.86-1.54-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.69 1.24 3.35.95.1-.74.4-1.24.73-1.53-2.55-.29-5.24-1.27-5.24-5.68 0-1.25.44-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.17a10.96 10.96 0 0 1 5.73 0c2.18-1.48 3.14-1.17 3.14-1.17.63 1.58.24 2.75.12 3.04.73.8 1.17 1.82 1.17 3.07 0 4.42-2.69 5.38-5.25 5.67.41.35.78 1.04.78 2.1 0 1.52-.02 2.75-.02 3.12 0 .31.21.66.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
      Continuar con GitHub
    </a>
    <p class="explain">Tu cuenta de GitHub protege los cambios.<br/>Después, abre tu libro en el editor.</p>
    <div class="divider" aria-hidden="true"></div>
    <a href="../" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>Volver al libro</a>
  </section>
</main>
</body>
</html>
