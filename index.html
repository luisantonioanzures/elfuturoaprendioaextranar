<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c211f">
  <meta name="description" content="Lee El futuro aprendió a extrañar, de Luis Antonio Anzures González, en línea.">
  <meta property="og:title" content="El futuro aprendió a extrañar — Luis Antonio Anzures González">
  <meta property="og:description" content="Una edición digital para leer en línea.">
  <meta property="og:type" content="book">
  <meta property="og:image" content="portada.jpg">
  <title>El futuro aprendió a extrañar — Luis Antonio Anzures González</title>
  <style>
    :root { color-scheme: light; --ink:#272620; --cream:#f2efe8; --warm:#e6e0d4; --gold:#ab6540; --reader:#202422; --reader-line:#414642; }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    html{background:var(--cream)}
    body{color:var(--ink);background:radial-gradient(ellipse at 50% 22%,#faf8f2 5%,var(--cream) 80%)}
    button{font:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    button:disabled{opacity:.45;cursor:default}
    [hidden]{display:none!important}
    .header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,64px);border-bottom:1px solid rgba(47,46,38,.10)}
    .brand{font-weight:750;font-size:11px;letter-spacing:.19em;line-height:1.5;text-transform:uppercase;color:#35312b}
    .brand span{display:block;font-size:9px;letter-spacing:.23em;color:#817667;font-weight:600}
    .header-actions{display:flex;align-items:center;gap:10px}
    .share{height:38px;width:38px;padding:0;display:grid;place-items:center;color:#51483e;background:transparent;border:1px solid #d7d0c4;border-radius:50%}
    .share svg{height:17px;width:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .quick-read{height:38px;white-space:nowrap;border:0;border-radius:8px;background:#272925;color:#fff9f0;padding:0 15px;font-size:11px;font-weight:750;letter-spacing:.04em}
    .home{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:25px 16px 30px;min-height:calc(100svh - 68px)}
    .cover{display:block;width:auto;height:auto;max-width:min(360px,84vw);max-height:min(60svh,530px);object-fit:contain;box-shadow:0 16px 45px rgba(42,31,16,.14),0 2px 7px rgba(42,31,16,.06);border-radius:2px}
    .primary{width:min(360px,84vw);min-height:50px;display:flex;align-items:center;justify-content:center;gap:16px;border:0;border-radius:9px;background:#282a26;color:#fff8eb;font-size:14px;font-weight:700;letter-spacing:.018em;box-shadow:0 8px 22px rgba(44,44,38,.1)}
    .primary:hover,.quick-read:hover{background:#46463c}
    .primary span{font-size:20px;line-height:1}
    .hint{margin:0;min-height:18px;color:#8e8678;font-size:11px;letter-spacing:.01em;text-align:center}
    .error{max-width:420px;margin:0;padding:11px 14px;border:1px solid #d4b4a3;background:#fcf0e6;border-radius:8px;font-size:12px;line-height:1.5;text-align:center;color:#7d3d27}
    /* Lector: ocupa toda la ventana, incluido el espacio útil en móviles. */
    .reader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--reader);color:#f8f5ed}
    body.is-reading{overflow:hidden}
    .reader-bar{flex-shrink:0;min-height:56px;padding:env(safe-area-inset-top,0px) clamp(12px,3vw,26px) 0;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--reader-line);background:#202422}
    .reader-title{min-width:0;flex:1;font-family:Georgia,serif;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f0e9db}
    .reader-icon{flex:0 0 auto;width:38px;height:38px;background:transparent;color:#f0e9db;border:0;border-radius:7px;display:grid;place-items:center;font-size:20px}
    .reader-icon:hover{background:#363d39}
    .reader-stage{flex:1;min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;display:flex;align-items:flex-start;justify-content:safe center;padding:clamp(9px,2vw,24px);background:#292d2a;scrollbar-color:#656c66 transparent}
    .page-paper{line-height:0;flex:none;margin:auto;background:#fff;box-shadow:0 6px 34px rgba(0,0,0,.32)}
    #page{display:block;background:white}
    .reader-bottom{flex-shrink:0;min-height:65px;padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--reader-line);display:flex;align-items:center;justify-content:center;gap:22px;background:#202422}
    .step{width:43px;height:40px;display:grid;place-items:center;border:1px solid #555b54;border-radius:10px;background:#343a35;color:#fff8eb;font-size:23px;line-height:1}
    .step:not(:disabled):hover{background:#4c524b}
    .page-count{min-width:110px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:#ede8df}
    .progress{position:absolute;bottom:0;left:0;width:100%;height:3px;background:#3b403b;overflow:hidden}
    .progress-fill{width:0;height:100%;background:#c49875;transition:width .18s ease}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    @media(max-width:640px){
      .header{height:59px;padding:0 18px}
      .brand{font-size:10px;letter-spacing:.13em}.brand span{font-size:8px}
      .quick-read{height:35px;padding:0 12px;font-size:10px}
      .share{height:35px;width:35px}
      .home{min-height:calc(100svh - 59px);justify-content:flex-start;padding-top:20px;gap:16px}
      .cover{max-width:82vw;max-height:58svh}
      .primary{width:min(340px,82vw)}
      .reader-bar{min-height:52px}
      .reader-title{font-size:12px}
      .reader-stage{padding:8px}
      .reader-bottom{gap:20px;min-height:60px}
    }
    @media(max-height:650px) and (max-width:640px){.home{padding-top:9px;gap:12px}.cover{max-height:53svh}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="header" id="header">
    <div class="brand">LUIS ANTONIO<span>Biblioteca</span></div>
    <div class="header-actions">
      <button class="share" type="button" id="share" aria-label="Compartir libro" title="Compartir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.7 10.5 15.2 6.5M8.7 13.5l6.5 4"/></svg>
      </button>
      <button type="button" class="quick-read" id="quick-read">LEER AHORA</button>
    </div>
  </header>
  <main class="home" id="home">
    <img class="cover" src="./portada.jpg" alt="Portada original de El futuro aprendió a extrañar, de Luis Antonio Anzures González" width="1153" height="1536">
    <button type="button" class="primary" id="read"><span id="read-label">Leer libro</span><span aria-hidden="true">→</span></button>
    <p class="hint" id="hint">La lectura se guarda automáticamente</p>
    <p class="error" id="error" role="alert" hidden></p>
  </main>
  <section class="reader" id="reader" aria-label="Lector de El futuro aprendió a extrañar" hidden>
    <div class="reader-bar">
      <button type="button" class="reader-icon" id="back" title="Volver a la portada" aria-label="Volver a la portada">←</button>
      <div class="reader-title">El futuro aprendió a extrañar</div>
      <button type="button" class="reader-icon" id="zoom" title="Ampliar página" aria-label="Ampliar página">⌕</button>
    </div>
    <div class="reader-stage" id="stage" tabindex="0" aria-label="Página del libro; desliza a los lados para cambiar de página">
      <div class="page-paper"><canvas id="page" role="img" aria-label="Página del libro"></canvas></div>
    </div>
    <div class="reader-bottom">
      <button type="button" class="step" id="prev" aria-label="Página anterior" title="Página anterior">‹</button>
      <div class="page-count" id="count" aria-live="polite">— / —</div>
      <button type="button" class="step" id="next" aria-label="Página siguiente" title="Página siguiente">›</button>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
  </section>
  <script type="module">
    const FILE = './libro.pdf';
    const STORAGE_KEY = 'el-futuro-aprendio-a-extranar:lectura:v2';
    const $ = id => document.getElementById(id);
    const stage = $('stage'), canvas = $('page');
    let documentPDF = null;
    let pageNumber = 1, magnified = false;
    let loading = false, rendering = false, rerender = false;
    let positionToRestore = 0;
    let scrollSaveTimer;
    function getSaved() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return {page: Math.max(1, Number.parseInt(data.page,10) || 1), ratio: Math.min(1,Math.max(0,Number(data.ratio)||0))};
      } catch (_) { return {page:1, ratio:0}; }
    }
    function savePosition() {
      if (!documentPDF) return;
      const max = Math.max(0,stage.scrollHeight-stage.clientHeight);
      const ratio = max ? stage.scrollTop / max : 0;
      try { localStorage.setItem(STORAGE_KEY,JSON.stringify({page:pageNumber,ratio:+ratio.toFixed(4)})); } catch (_) {}
      updateStartButton();
    }
    function updateStartButton() {
      const saved = getSaved();
      $('read-label').textContent = saved.page>1 ? 'Continuar leyendo' : 'Leer libro';
      $('quick-read').textContent = saved.page>1 ? 'CONTINUAR' : 'LEER AHORA';
      $('hint').textContent = saved.page>1 ? `Guardado en la página ${saved.page}` : 'La lectura se guarda automáticamente';
    }
    updateStartButton();
    function showError(message) { $('error').textContent = message; $('error').hidden = false; }
    function navigation() {
      $('count').textContent = documentPDF ? `${pageNumber} / ${documentPDF.numPages}` : '— / —';
      $('prev').disabled = !documentPDF || pageNumber<=1;
      $('next').disabled = !documentPDF || pageNumber>=documentPDF.numPages;
      $('progress-fill').style.width = documentPDF ? `${(pageNumber/documentPDF.numPages)*100}%` : '0%';
      $('zoom').setAttribute('aria-label', magnified?'Ajustar página a pantalla':'Ampliar página');
      $('zoom').title = magnified?'Ajustar página a pantalla':'Ampliar página';
    }
    navigation();
    async function openReader() {
      if (loading) return;
      $('error').hidden = true;
      if (!documentPDF) {
        loading = true;
        $('read-label').textContent = 'Abriendo…';
        $('quick-read').disabled = true;
        $('read').disabled = true;
        try {
          const pdfjs = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
          pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
          documentPDF = await pdfjs.getDocument({url:FILE}).promise;
          const saved = getSaved();
          pageNumber = Math.min(documentPDF.numPages, saved.page);
          positionToRestore = saved.ratio;
        } catch (err) {
          console.warn('No se pudo iniciar el lector:', err);
          showError('Para activar la lectura, sube el archivo de tu libro con el nombre exacto «libro.pdf» al repositorio de GitHub, junto a index.html.');
          return;
        } finally {
          loading = false;
          $('read').disabled = false;
          $('quick-read').disabled = false;
          updateStartButton();
        }
      }
      $('reader').hidden = false;
      document.body.classList.add('is-reading');
      history.replaceState(null,'',`${location.pathname}${location.search}#leer`);
      navigation();
      await renderPage();
    }
    function closeReader() {
      savePosition();
      $('reader').hidden = true;
      document.body.classList.remove('is-reading');
      history.replaceState(null,'',`${location.pathname}${location.search}`);
      updateStartButton();
    }
    async function renderPage() {
      if (!documentPDF || $('reader').hidden) return;
      if (rendering) { rerender = true; return; }
      rendering = true;
      try {
        do {
          rerender = false;
          const shownPage = pageNumber;
          const ratioToRestore = positionToRestore;
          positionToRestore = 0;
          const page = await documentPDF.getPage(shownPage);
          if (rerender) continue;
          const natural = page.getViewport({scale:1});
          const padding = parseFloat(getComputedStyle(stage).paddingLeft)||8;
          const availableWidth = Math.max(200,stage.clientWidth-padding*2-2);
          const availableHeight = Math.max(200,stage.clientHeight-padding*2-2);
          let baseScale = availableWidth/natural.width;
          if (innerWidth>760) baseScale = Math.min(baseScale, availableHeight/natural.height);
          const viewport = page.getViewport({scale:baseScale*(magnified?1.65:1)});
          const pixelRatio = Math.min(2,devicePixelRatio||1);
          const ctx = canvas.getContext('2d',{alpha:false});
          canvas.width = Math.max(1,Math.ceil(viewport.width*pixelRatio));
          canvas.height = Math.max(1,Math.ceil(viewport.height*pixelRatio));
          canvas.style.width = `${viewport.width}px`;
          canvas.style.height = `${viewport.height}px`;
          await page.render({canvasContext:ctx,viewport,transform:[pixelRatio,0,0,pixelRatio,0,0]}).promise;
          if (rerender) continue;
          requestAnimationFrame(() => {
            stage.scrollTop = Math.max(0,stage.scrollHeight-stage.clientHeight)*ratioToRestore;
            if (!magnified) stage.scrollLeft = 0;
          });
          navigation();
        } while (rerender);
      } catch (err) {
        console.error('Error al mostrar página:',err);
        $('count').textContent = 'Error de lectura';
      } finally {
        rendering = false;
      }
    }
    function go(delta) {
      if (!documentPDF || $('reader').hidden) return;
      const next = Math.max(1,Math.min(documentPDF.numPages,pageNumber+delta));
      if (next===pageNumber) return;
      pageNumber = next;
      stage.scrollTop = 0;
      stage.scrollLeft = 0;
      positionToRestore = 0;
      try{ localStorage.setItem(STORAGE_KEY,JSON.stringify({page:pageNumber,ratio:0})); }catch(_){}
      navigation();
      renderPage();
    }
    $('read').addEventListener('click',openReader);
    $('quick-read').addEventListener('click',openReader);
    $('back').addEventListener('click',closeReader);
    $('prev').addEventListener('click',()=>go(-1));
    $('next').addEventListener('click',()=>go(1));
    $('zoom').addEventListener('click',()=>{
      if (!documentPDF) return;
      magnified = !magnified;
      positionToRestore = stage.scrollHeight>stage.clientHeight ? stage.scrollTop/(stage.scrollHeight-stage.clientHeight) : 0;
      navigation();renderPage();
    });
    stage.addEventListener('scroll',()=>{
      clearTimeout(scrollSaveTimer);
      scrollSaveTimer=setTimeout(savePosition,200);
    },{passive:true});
    let startX=0,startY=0;
    stage.addEventListener('touchstart',e=>{
      if (e.touches.length!==1) return;
      startX=e.touches[0].clientX;startY=e.touches[0].clientY;
    },{passive:true});
    stage.addEventListener('touchend',e=>{
      if (magnified || !startX || e.changedTouches.length!==1) return;
      const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;
      if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6) go(dx<0?1:-1);
      startX=0;
    },{passive:true});
    window.addEventListener('keydown',e=>{
      if($('reader').hidden) return;
      if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(1)}
      else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}
      else if(e.key==='Escape'){e.preventDefault();closeReader()}
    });
    let resizeTimeout;
    window.addEventListener('resize',()=>{
      if($('reader').hidden)return;
      clearTimeout(resizeTimeout);
      resizeTimeout=setTimeout(()=>{
        const max=Math.max(0,stage.scrollHeight-stage.clientHeight);
        positionToRestore=max?stage.scrollTop/max:0;
        renderPage();
      },180);
    });
    window.addEventListener('pagehide',savePosition);
    $('share').addEventListener('click',async()=>{
      const url=location.href.replace(/#.*$/,'');
      try {
        if(navigator.share) await navigator.share({title:'El futuro aprendió a extrañar',url});
        else if(navigator.clipboard) {await navigator.clipboard.writeText(url); const b=$('share');b.title='Enlace copiado';setTimeout(()=>b.title='Compartir',1800)}
        else window.prompt('Copia el enlace:',url);
      } catch(e) {if(e.name!=='AbortError')window.prompt('Copia el enlace:',url)}
    });
    if(location.hash==='#leer') openReader();
  </script>
</body>
</html>
